[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ai-shield"
version = "1.0.0"
description = "Intelligent NLP Security & Reliability Framework for LLMs"
authors = ["AI-SHIELD Team <research@ai-shield.internal>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = ">=0.100.0"
uvicorn = ">=0.22.0"
python-dotenv = ">=1.0.0"
pydantic = ">=2.0.0"
python-multipart = ">=0.0.6"
pypdf = ">=3.0.0"
python-docx = ">=0.8.11"
networkx = ">=3.0"
fuzzywuzzy = ">=0.18.0"
python-Levenshtein = ">=0.21.0"
scikit-learn = ">=1.2.0"
pandas = ">=2.0.0"
nltk = ">=3.8.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.0.0"
httpx = ">=0.24.0"
